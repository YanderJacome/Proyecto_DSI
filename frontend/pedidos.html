<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Pedido - Restaurante DSI</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/pages/pedidos.css">
</head>
<body>
    <header class="main-header">
        <div>
            <h1>Registrar Pedido</h1>
            <span id="mesaInfo" class="mesa-info">Mesa: Cargando...</span>
        </div>
        <div class="user-info">
            <button id="btnVolver" class="btn-secondary">Volver a Mesas</button>
            <button id="btnLogout" class="btn-danger">Cerrar Sesión</button>
        </div>
    </header>

    <main class="pedido-container">
        <!-- Columna Izquierda: Menú -->
        <section class="menu-section">
            <h2>Menú</h2>
            <div id="categoriasTabs" class="categorias-tabs">
                <!-- Las categorías se cargarán aquí -->
            </div>
            <div id="productosGrid" class="productos-grid">
                <!-- Los productos se cargarán aquí -->
            </div>
        </section>

        <!-- Columna Derecha: Carrito -->
        <aside class="carrito-section">
            <h2>Orden Actual</h2>
            <div id="carritoItems" class="carrito-items">
                <p class="empty-cart">No hay productos agregados.</p>
            </div>
            
            <div class="carrito-total">
                <h3>Total:</h3>
                <h2 id="totalPedido">$0</h2>
            </div>
            
            <button id="btnConfirmarPedido" class="btn-primary btn-block" disabled>
                Confirmar Pedido
            </button>
            <div id="mensajeError" class="error-message hidden"></div>
        </aside>
    </main>

    <script type="module" src="/js/pages/pedidos.js"></script>
</body>
</html>
