<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesas - Restaurante DSI</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/pages/mesas.css">
</head>
<body>
    <!-- HEADER MODERNO -->
    <header class="main-header">
        <div class="header-brand">
            <h1>🍽️ Gestión de Mesas</h1>
        </div>
        
        <nav class="header-nav">
            <a href="/mesas.html" class="nav-link active">Mesas</a>
            <a href="/facturacion.html" id="navFacturacion" class="nav-link">Facturación</a>
            <a href="/reportes.html" id="navReportes" class="nav-link">Reportes</a>
            <a href="/usuarios.html" id="navUsuarios" class="nav-link">Usuarios</a>
        </nav>

        <div class="header-user">
            <span id="userName" class="user-badge"></span>
            <button id="btnLogout" class="btn-logout">Salir</button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container">
        <div class="dashboard-panel">
            <h2>Mapa del Salón</h2>
            <div class="leyenda">
                <div class="leyenda-item"><span class="color-box verde"></span> Disponible</div>
                <div class="leyenda-item"><span class="color-box rojo"></span> Ocupada</div>
                <div class="leyenda-item"><span class="color-box amarillo"></span> Reservada</div>
            </div>
        </div>
        
        <div id="mesasGrid" class="mesas-grid">
            <p class="loading-text">Cargando mesas...</p>
        </div>
    </main>

    <!-- MODAL (Oculto por defecto) -->
    <div id="modalMesa" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2 id="modalTitulo">Pedidos de la Mesa</h2>
            <div id="modalPedidosList" class="modal-list"></div>
        </div>
    </div>

    <script type="module" src="/js/pages/mesas.js"></script>
</body>
</html>
