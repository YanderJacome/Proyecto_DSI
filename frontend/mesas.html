<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesas - Restaurante DSI</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/pages/mesas.css">
</head>
<body>
    <header class="main-header">
        <h1>Gestión de Mesas</h1>
        <div class="user-info">
            <span id="userName"></span>
            <button id="btnLogout">Cerrar Sesión</button>
        </div>
    </header>

    <main class="container">
        <div class="leyenda">
            <div class="leyenda-item"><span class="color-box verde"></span> Disponible</div>
            <div class="leyenda-item"><span class="color-box rojo"></span> Ocupada</div>
            <div class="leyenda-item"><span class="color-box amarillo"></span> Reservada</div>
        </div>
        
        <div id="mesasGrid" class="mesas-grid">
            <p>Cargando mesas...</p>
        </div>
    </main>

    <script type="module" src="/js/pages/mesas.js"></script>
</body>
</html>
