<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocina - Restaurante DSI</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/pages/cocina.css">
    <!-- Cliente de SignalR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
</head>
<body>
    <header class="main-header" style="background-color: #d35400;">
        <h1>Monitor de Cocina</h1>
        <div class="user-info">
            <span id="userName"></span>
            <button id="btnLogout" style="background-color: #c0392b;">Cerrar Sesión</button>
        </div>
    </header>

    <main class="cocina-board">
        <div class="columna">
            <h2>🔔 Nuevos Pedidos</h2>
            <div id="col-enviado" class="pedidos-container"></div>
        </div>
        <div class="columna">
            <h2>🍳 En Preparación</h2>
            <div id="col-preparacion" class="pedidos-container"></div>
        </div>
        <div class="columna">
            <h2>✅ Listos para Servir</h2>
            <div id="col-listo" class="pedidos-container"></div>
        </div>
    </main>

    <script type="module" src="/js/pages/cocina.js"></script>
</body>
</html>
