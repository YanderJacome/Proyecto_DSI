<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Restaurante DSI</title>
    <!-- Estilos base globales -->
    <link rel="stylesheet" href="/css/styles.css">
    <!-- Estilos exclusivos para esta página -->
    <link rel="stylesheet" href="/css/pages/login.css">
</head>
<body class="login-body">
    
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <p class="login-subtitle">Sistema de Gestión Integral para Restaurante</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" required placeholder="admin@restaurante.com">
            </div>
            
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" required placeholder="••••••••">
            </div>
            
            <button type="submit" id="btnLogin">Ingresar</button>
            
            <div id="errorMessage" class="error-message hidden"></div>
        </form>
    </div>

    <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
