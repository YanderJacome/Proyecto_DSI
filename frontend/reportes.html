<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Restaurante DSI</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/pages/reportes.css">
</head>
<body>
    <!-- HEADER UNIFICADO -->
    <header class="main-header">
        <div class="header-brand">
            <h1>📊 Reportes y Estadísticas</h1>
        </div>
        
        <nav class="header-nav">
            <a href="/mesas.html" class="nav-link">Mesas</a>
            <a href="/facturacion.html" class="nav-link">Facturación</a>
            <a href="/reportes.html" class="nav-link active">Reportes</a>
            <a href="/usuarios.html" id="navUsuarios" class="nav-link">Usuarios</a>
        </nav>

        <div class="header-user">
            <span id="userName" class="user-badge"></span>
            <button id="btnLogout" class="btn-logout">Salir</button>
        </div>
    </header>

    <main class="container">
        <!-- SECCIÓN DIARIA -->
        <div class="dashboard-section">
            <div class="section-header">
                <h2>📅 Reporte Diario</h2>
                <div class="filtro-fecha">
                    <input type="date" id="fechaReporte">
                    <button id="btnConsultar" class="btn-primary">Consultar</button>
                    <button id="btnExportar" class="btn-danger">Exportar a PDF</button>
                </div>
            </div>

            <div class="kpi-grid" id="kpiContainer">
                <p class="loading-text">Cargando datos...</p>
            </div>

            <div class="metodos-pago-container">
                <h3>Distribución por Método de Pago</h3>
                <div id="metodosPago" class="metodos-grid">
                    <!-- Aquí irán los métodos de pago -->
                </div>
            </div>
        </div>

        <!-- SECCIÓN MENSUAL (HU-10) -->
        <div class="dashboard-section monthly-section">
            <div class="section-header">
                <h2>📈 Resumen del Mes</h2>
                <div class="filtro-mes">
                    <select id="mesSelect" class="form-control">
                        <!-- Opciones generadas por JS -->
                    </select>
                    <select id="anioSelect" class="form-control">
                        <!-- Opciones generadas por JS -->
                    </select>
                </div>
            </div>
            
            <div class="kpi-grid" id="kpiMensual">
                <p class="loading-text">Cargando datos mensuales...</p>
            </div>
        </div>
    </main>

    <script type="module" src="/js/pages/reportes.js"></script>
</body>
</html>
